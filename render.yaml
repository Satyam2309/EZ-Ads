# EZ Ads — deployment configuration for Render (single service)
# Express API serves both the backend API and the pre-built React SPA from client/dist.
services:
  - type: web
    name: ez-ads
    runtime: node
    plan: free
    region: singapore # nearest to India
    rootDir: server
    buildCommand: npm ci && cd ../client && npm ci --include=dev && npm run build
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas string in Render dashboard
      - key: CLIENT_ORIGIN
        value: https://ezads.co.in
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_STATE_SECRET
        generateValue: true
      - key: TOKEN_ENC_KEY
        generateValue: true
      - key: OAUTH_MOCK_MODE
        value: "false"
      # Render free web services block outbound SMTP (25/465/587), so HTTPS email
      # APIs are the only senders that work here. Resend takes priority when set.
      - key: RESEND_API_KEY
        sync: false # Set in Render dashboard after verifying the sending domain
      - key: EMAIL_HOST
        value: smtpout.secureserver.net
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USER
        value: hello@ezads.co.in
      - key: EMAIL_PASS
        sync: false # Set in Render dashboard
      - key: EMAIL_FROM
        value: EZ Ads <hello@ezads.co.in>
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_REDIRECT_URI
        value: https://ezads.co.in/api/auth/instagram/callback
