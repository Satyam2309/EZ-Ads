<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EZ Ads — Influencer Marketing Marketplace</title>
    <meta name="description" content="EZ Ads connects brands with Instagram creators for sponsored campaigns." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Link-preview tags. og:* and twitter:* require absolute URLs, so the host
      comes from the %SITE_URL% placeholder — vite.config.js replaces it at
      build time from the SITE_URL environment variable (default: the Render
      hostname in render.yaml). Change it there, not here.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EZ Ads" />
    <meta property="og:title" content="EZ Ads — Influencer Marketing Marketplace" />
    <meta
      property="og:description"
      content="Connect your brand with Instagram creators. Discover verified profiles, run campaigns, and track delivery in one workspace."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EZ Ads — where brands meet Instagram creators" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EZ Ads — Influencer Marketing Marketplace" />
    <meta
      name="twitter:description"
      content="Connect your brand with Instagram creators. Discover verified profiles, run campaigns, and track delivery in one workspace."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-card.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      // apply saved theme before first paint so dark mode never flashes
      (function () {
        try {
          var t = localStorage.getItem('ezads-theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-(--color-canvas) text-(--color-ink) antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
